<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App 📝</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

</head>

<body>
    <div class="main-container">
        <div class="notes-section">
            <h2>My Notes</h2>
            <textarea class="note-input" placeholder="Write a note..."></textarea>
            <button class="add-note-btn"><strong>Add Note</strong></button>
            <hr>
            <p>Your notes <span class="count-notes">(0)</span></p>
            <span class="text-info"> No notes yet. Add your first one.</span>
            <ul class="notes-list">
                
            </ul>
        </div>
    </div>



    <script src="/script.js"></script>
</body>

</html>
